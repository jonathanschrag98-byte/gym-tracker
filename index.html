<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
    --text:#eef0f4; --muted:#8b93a3; --accent:#c6f432; --accent-ink:#141a00;
    --warn:#ff8a5c; --run:#5cc8ff; --good:#5ee2a0; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
  body{padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 90px)}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:10px 2px 14px}
  h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .card h2{font-size:16px;margin:0 0 4px;font-weight:700}
  .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:10px}
  .seg button{flex:1;border:none;background:none;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;padding:8px 4px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  .ex{padding:10px 0;border-top:1px solid var(--line)}
  .ex:first-of-type{border-top:none;padding-top:2px}
  .exhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .exname{font-weight:700;font-size:15px}
  .exmeta{color:var(--muted);font-size:12px;margin-top:2px}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(198,244,50,.14);color:var(--accent);white-space:nowrap}
  .setrow{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center;margin-bottom:6px}
  .setrow.bw{grid-template-columns:34px 1fr 48px}
  .opt{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:middle}
  .setrow.pull{grid-template-columns:34px 1fr 1fr 48px}
  .setno{color:var(--muted);font-size:13px;font-weight:600;text-align:center}
  .field{position:relative}
  .field input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 34px 11px 10px;font-size:16px;font-family:inherit;font-weight:600;outline:none}
  .field input::placeholder{color:#565d6b;font-weight:500}
  .field input:focus{border-color:var(--accent)}
  .field small{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px;pointer-events:none}
  .done{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:20px;cursor:pointer}
  .done.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .setrow.isdone input{border-color:rgba(198,244,50,.35)}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--warn);border:1px solid rgba(255,138,92,.4)}
  .btn+.btn{margin-top:8px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .hint{color:var(--muted);font-size:13px;line-height:1.45}
  .note{background:rgba(255,138,92,.1);border:1px solid rgba(255,138,92,.3);color:#ffc2a8;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:center;z-index:5}
  nav .in{display:flex;gap:6px;max-width:560px;width:100%}
  nav button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:8px 0;border-radius:12px;cursor:pointer}
  nav button .ic{display:block;font-size:20px;margin-bottom:2px}
  nav button.act{color:var(--accent);background:rgba(198,244,50,.08)}
  .timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);width:calc(100% - 28px);max-width:532px;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .timer.show{display:flex}
  .timer .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;min-width:70px}
  .timer .lbl{flex:1;font-size:12px;font-weight:600;line-height:1.3}
  .timer button{background:rgba(0,0,0,.14);border:none;color:var(--accent-ink);font-weight:800;font-family:inherit;border-radius:10px;padding:9px 10px;font-size:13px;cursor:pointer}
  .timer.over{background:var(--warn)}
  .stat{display:flex;gap:10px;margin-bottom:12px}
  .stat>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat b{display:block;font-size:22px;font-weight:800}
  .stat span{color:var(--muted);font-size:12px}
  .list .item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);gap:10px}
  .list .item:first-child{border-top:none}
  .x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px}
  .wbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .lbl input{margin-top:4px}
  .wbox input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-size:16px;font-family:inherit;outline:none;color-scheme:dark}
  details{border-top:1px solid var(--line);padding:10px 0}
  details:first-child{border-top:none}
  summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  summary::-webkit-details-marker{display:none}
  .dl{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.6}
  .dl b{color:var(--text);font-weight:600}
  .best{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}
  .best span:nth-child(even){font-weight:700;text-align:right}
  .week{display:flex;gap:6px;margin:12px 0 10px}
  .week div{flex:1;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
  .week i{display:block;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);margin-bottom:4px}
  .week i.on{background:var(--accent);border-color:var(--accent)}
  .week i.run{background:var(--run);border-color:var(--run)}
  .week i.on.run{background:linear-gradient(135deg,var(--accent) 50%,var(--run) 50%)}
  .week i.now{border-color:var(--muted)}
  .goal{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .goal button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;font-weight:700;cursor:pointer}
  .goal b{color:var(--text);min-width:16px;text-align:center}
  select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font-size:15px;font-family:inherit;margin:8px 0 10px;color-scheme:dark}
  .big{display:flex;align-items:baseline;gap:8px;margin:2px 0 6px}
  .big b{font-size:28px;font-weight:800;white-space:nowrap}
  textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font-size:15px;font-family:inherit;outline:none;resize:vertical;margin-top:4px}
  .ans{font-size:14.5px;line-height:1.55}
  .ans ul{margin:6px 0 10px;padding-left:20px}
  .ans li{margin-bottom:4px}
  .ans h4{margin:12px 0 4px;font-size:14px;color:var(--accent)}
  .ans p{margin:0 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chips button{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:8px 12px;font-size:13px;font-family:inherit;cursor:pointer}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:14px}
  .modal.show{display:flex}
  .modal .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;width:100%;max-width:520px;margin-bottom:env(safe-area-inset-bottom)}
  .modal p{margin:0 0 14px;line-height:1.45}
  svg text{fill:var(--muted);font-size:10px;font-family:Inter,sans-serif}
  .empty{color:var(--muted);text-align:center;padding:20px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Gym<span>.</span></h1><div style="display:flex;align-items:center;gap:8px"><div class="sub" id="status">lädt …</div><button data-tab="settings" aria-label="Einstellungen" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px">⚙️</button></div></header>
  <div id="note"></div>
  <main id="view"></main>
</div>

<div class="timer" id="timer">
  <div class="t" id="tval">1:30</div>
  <div class="lbl" id="tlbl">Pause</div>
  <button data-act="tminus">−15</button>
  <button data-act="tplus">+15</button>
  <button data-act="tskip">✕</button>
</div>

<nav><div class="in">
  <button data-tab="training" class="act"><span class="ic">🏋️</span>Training</button>
  <button data-tab="run"><span class="ic">🏃</span>Laufen</button>
  <button data-tab="food"><span class="ic">🥗</span>Essen</button>
  <button data-tab="weight"><span class="ic">⚖️</span>Gewicht</button>
  <button data-tab="history"><span class="ic">📈</span>Verlauf</button>
</div></nav>

<div class="modal" id="modal"><div class="box"><p id="mtext"></p><div class="row"><button class="btn ghost" data-act="mno">Abbrechen</button><button class="btn danger" data-act="myes">Ja</button></div></div></div>

<script src="platform.js"></script>
<script>
const ALL = [
  {id:"sq",  name:"Kniebeugen",               group:null, sets:3, reps:"8",      top:8,  rest:150, note:"Vorher 2 Aufwärmsätze"},
  {id:"dl",  name:"Kreuzheben",               group:null, sets:3, reps:"5",      top:5,  rest:180, note:"Vorher 2–3 Aufwärmsätze"},
  {id:"pu",  name:"Klimmzüge",                group:null, sets:4, reps:"1–2 + 1–2 negative", pull:true, rest:120},
  {id:"ohp", name:"Schulterdrücken stehend",  group:null, sets:3, reps:"8",      top:8,  rest:150, note:"Vorher 1 Aufwärmsatz"},
  {id:"bp",  name:"Bankdrücken",              group:null, sets:3, reps:"8",      top:8,  rest:150, note:"Vorher 1–2 Aufwärmsätze"},
  {id:"row", name:"Langhantelrudern",         group:null, sets:3, reps:"8",      top:8,  rest:120},
  {id:"fp2", name:"Face Pulls (Kabelzug)",    group:null, sets:3, reps:"12–15",  top:15, rest:75, inc:"+1 Stufe", note:"Seil zur Stirn, Ellbogen hoch"},
  {id:"dbc", name:"Kurzhantel-Curls (Schrägbank)", group:"C", sets:2, reps:"10–12", top:12, rest:60, restS:75, inc:"+1–2 kg", note:"kg pro Hantel"},
  {id:"fp",  name:"French Press",             group:"C",  sets:2, reps:"10–12",  top:12, rest:60, restS:75},
  {id:"khr", name:"Hängendes Knieheben",      group:null, sets:2, reps:"10–15",  top:15, rest:60, bw:true, opt:true},
  {id:"fly", name:"Butterfly Kabelzug",       group:null, sets:2, reps:"12–15",  top:15, rest:90, old:true},
  {id:"curl",name:"Langhantel-Curls",         group:"C",  sets:2, reps:"10–12",  top:12, rest:60, restS:75, old:true},
];
const EX = Object.fromEntries(ALL.map(e=>[e.id,e]));
const DAYS = { A:["sq","bp","pu","ohp","row","fp2","dbc","fp","khr"], B:["dl","bp","pu","ohp","row","fp2","dbc","fp","khr"] };
const planFor = d => DAYS[d==="B"?"B":"A"].map(id=>EX[id]);
const LIST = ALL.filter(e=>!e.old).concat(ALL.filter(e=>e.old));
function nextDay(){ const l = workouts().find(x=>x.day); return l && l.day==="A" ? "B" : (l && l.day==="B" ? "A" : "A"); }
function curPlan(){ return planFor(S.draft ? S.draft.day : (S.day || nextDay())); }
const BN = {A:"1", B:"2", C:"Arme"};

const S = { justFinished:false, coachBusy:false, coachText:"", coachErr:"", coachQ:"", profOpen:false, rm:"pace", paceManual:false, pendingRender:false, sample:null, canImg:false, runExtra:null, importMsg:"", importing:false, sel:"sq", tab:"training", docs:[], draft:null, loaded:false, db:null, uid:null, timer:null, confirm:null };
let col = null, writeChain = Promise.resolve(), draftTimer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if (v===""||v==null) return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmt = n => n==null ? "" : String(Math.round(n*100)/100).replace(".", ",");
const dDE = ts => new Date(ts).toLocaleDateString("de-DE",{weekday:"short", day:"2-digit", month:"2-digit", year:"2-digit"});
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

function workouts(){ return S.docs.filter(d=>d.type==="workout").sort((a,b)=>b.date-a.date); }
function weights(){ return S.docs.filter(d=>d.type==="weight").sort((a,b)=>a.day.localeCompare(b.day)); }
function settings(){ const s = S.docs.find(d=>d._id==="settings") || {}; return {pullGoal: s.pullGoal||5, weekGoal: s.weekGoal||3}; }
function setSetting(k, v){
  const s = {...settings(), [k]: v, type:"settings"};
  S.docs = S.docs.filter(d=>d._id!=="settings").concat({_id:"settings", ...s});
  if (col) queueWrite(()=>col.doc("settings").set(s));
  render();
}
function runs(){ return S.docs.filter(d=>d.type==="run").sort((a,b)=>b.day.localeCompare(a.day)||(b.ts||0)-(a.ts||0)); }
function parseTime(v){
  v = String(v||"").trim().replace(",", "."); if (!v) return null;
  if (v.includes(":")){ const p = v.split(":").map(Number); if (p.some(x=>!isFinite(x))) return null; return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1]; }
  const m = parseFloat(v); return isFinite(m) ? Math.round(m*60) : null;
}
const mmss = s => { s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=String(s%60).padStart(2,"0"); return h ? h+":"+String(m).padStart(2,"0")+":"+x : m+":"+x; };
function monday(ts){ const d=new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); }
function weekInfo(){
  const goal = settings().weekGoal, w = workouts(), cnt = {};
  for (const x of w){ const k = monday(x.date); cnt[k]=(cnt[k]||0)+1; }
  const now = monday(Date.now()), thisWeek = cnt[now]||0;
  let streak = 0, k = now;
  if (thisWeek < goal) k = monday(now - 3*864e5);
  while ((cnt[k]||0) >= goal){ streak++; k = monday(k - 3*864e5); }
  const days = Array(7).fill(false), rdays = Array(7).fill(false);
  for (const x of w) if (monday(x.date)===now) days[(new Date(x.date).getDay()+6)%7] = true;
  let km = 0, rc = 0;
  for (const x of runs()){ const t = new Date(x.day+"T12:00").getTime(); if (monday(t)===now){ rdays[(new Date(t).getDay()+6)%7] = true; km += x.km||0; rc++; } }
  return {goal, thisWeek, streak, days, rdays, km, rc, today:(new Date().getDay()+6)%7};
}
const e1rm = (kg, reps) => reps>0 && kg>0 ? kg*(1+reps/30) : 0;
function lineChart(pts, o={}){
  if (pts.length < 2) return `<div class="empty" style="padding:10px 0">Ab 2 Trainings siehst du hier eine Kurve.</div>`;
  const W=320,H=150,P=28, ys=pts.map(p=>p.y).concat(o.goal!=null?[o.goal]:[]).concat(o.trend?o.trend.map(p=>p.y):[]);
  let mn=Math.min(...ys), mx=Math.max(...ys); if (o.zero) mn=0; const span=o.minSpan||1; if (mx-mn<span){ mn-=span/2; mx+=span/2; }
  const t0=pts[0].x, t1=pts[pts.length-1].x;
  const X = x => P + (t1===t0?0.5:(x-t0)/(t1-t0))*(W-P-8), Y = v => 18 + (1-(v-mn)/(mx-mn))*(H-P-18);
  const d = x => new Date(x).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
  const r1 = o.fy || (v => fmt(Math.round(v*10)/10));
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    <line x1="${P}" x2="${W-8}" y1="${Y(mx)}" y2="${Y(mx)}" stroke="#2a2f3a"/><line x1="${P}" x2="${W-8}" y1="${Y(mn)}" y2="${Y(mn)}" stroke="#2a2f3a"/>
    <text x="0" y="${Y(mx)+3}">${r1(mx)}</text><text x="0" y="${Y(mn)+3}">${r1(mn)}</text>
    ${o.goal!=null?`<line x1="${P}" x2="${W-8}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="#ff8a5c" stroke-dasharray="4 4"/><text x="${W-8}" y="${Y(o.goal)-4}" text-anchor="end" style="fill:#ff8a5c">Ziel ${r1(o.goal)}</text>`:""}
    ${o.trend ? `<polyline points="${pts.map(p=>X(p.x).toFixed(1)+","+Y(p.y).toFixed(1)).join(" ")}" fill="none" stroke="#8b93a3" stroke-opacity=".45" stroke-width="1.2"/>
    ${pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.4" fill="#8b93a3" fill-opacity=".7"/>`).join("")}
    <polyline points="${o.trend.map(p=>X(p.x).toFixed(1)+","+Y(p.y).toFixed(1)).join(" ")}" fill="none" stroke="#c6f432" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`
    : `<polyline points="${pts.map(p=>X(p.x).toFixed(1)+","+Y(p.y).toFixed(1)).join(" ")}" fill="none" stroke="#c6f432" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="#c6f432"/>`).join("")}`}
    <text x="${P}" y="${H-4}">${d(t0)}</text><text x="${W-8}" y="${H-4}" text-anchor="end">${d(t1)}</text>
  </svg>`;
}
function lastSets(exId){
  for (const w of workouts()){ const s = w.sets && w.sets[exId]; if (s && s.length) return s; }
  return null;
}
function isSuper(g){ return !!(S.draft && S.draft.mode && S.draft.mode[g]); }
function restOf(ex){ return ex.group && !isSuper(ex.group) ? (ex.restS||ex.rest) : ex.rest; }
function suggestUp(ex){
  if (ex.pull || ex.bw || !ex.top) return false;
  const s = lastSets(ex.id); if (!s || s.length < ex.sets) return false;
  return s.every(x => (x.reps||0) >= ex.top && x.kg);
}

/* ---------- persistence ---------- */
function queueWrite(fn){
  writeChain = writeChain.then(fn).catch(e => {
    if (e && e.code==="quota_exceeded") showNote("Speicher voll – bitte alte Einträge löschen.");
    else showNote("Speichern fehlgeschlagen. Prüfe deine Verbindung.");
  });
  return writeChain;
}
function saveDraftSoon(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => { if (col && S.draft) { const body = JSON.parse(JSON.stringify(S.draft)); queueWrite(()=>col.doc("draft").set(body)); } }, 700);
}
function showNote(t){ $("#note").innerHTML = t ? `<div class="note">${esc(t)}</div>` : ""; }

async function init(){
  render();
  const lt = setTimeout(()=>{ if(!S.loaded){ $("#status").textContent="offline?"; showNote("Daten noch nicht erreichbar – Einträge werden evtl. nicht gespeichert."); } }, 10000);
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid){ clearTimeout(lt); $("#status").textContent="ohne Speicher"; showNote("Speichern ist hier nicht verfügbar. Öffne die App angemeldet auf claude.ai."); return; }
    S.db = db; S.uid = uid;
    claude.use("sample").then(async s => { if (!s) return; S.sample = s; const l = await s.limits().catch(()=>null); S.canImg = !!(l && l.images); if (S.tab==="run"||S.tab==="food") render(); }).catch(()=>{});
    col = db.collection("data/users/" + uid);
    col.onSnapshot(snap => {
      S.docs = snap.docs.map(d => ({ _id:d.id, ...d.data() }));
      const dr = S.docs.find(d => d._id==="draft");
      if (!S.loaded && dr && dr.started && !S.draft) S.draft = JSON.parse(JSON.stringify({started:dr.started, day:dr.day||"A", sets:dr.sets||{}, mode:dr.mode||{A:true,B:true,C:true}}));
      if (!snap.metadata.fromCache){ S.loaded = true; clearTimeout(lt); $("#status").textContent = "auf dem Handy ✓"; showNote(""); }
      const ae = document.activeElement;
      if (ae && (ae.tagName==="INPUT" || ae.tagName==="SELECT" || ae.tagName==="TEXTAREA")) S.pendingRender = true; else render();
    }, err => { clearTimeout(lt); $("#status").textContent="Fehler"; showNote("Daten konnten nicht geladen werden."); });
  } catch(e){ clearTimeout(lt); $("#status").textContent="ohne Speicher"; showNote("Speichern ist hier nicht verfügbar."); }
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("act", b.dataset.tab===S.tab));
  const v = $("#view");
  if (S.tab==="training") v.innerHTML = S.draft ? viewActive() : viewStart();
  if (S.tab==="weight") v.innerHTML = viewWeight();
  if (S.tab==="run") v.innerHTML = viewRun();
  if (S.tab==="food") v.innerHTML = viewFood();
  if (S.tab==="history") v.innerHTML = viewHistory();
  if (S.tab==="settings") v.innerHTML = viewSettings();
}

function groupsOf(){
  const out=[]; for (const e of curPlan()){ const g=out[out.length-1]; if (e.group && g && g.group===e.group) g.items.push(e); else out.push({group:e.group, items:[e]}); } return out;
}
function setInputs(ex){
  const cur = S.draft.sets[ex.id] || [];
  const prev = lastSets(ex.id) || [];
  let h = "";
  for (let i=0;i<ex.sets;i++){
    const s = cur[i] || {}; const p = prev[i] || prev[prev.length-1] || {};
    if (ex.pull){
      h += `<div class="setrow pull ${s.done?"isdone":""}" data-ex="${ex.id}" data-i="${i}">
        <div class="setno">${i+1}</div>
        <div class="field"><input inputmode="numeric" data-f="reps" value="${fmt(s.reps)}" placeholder="${p.reps!=null?fmt(p.reps):"–"}"><small>Wdh</small></div>
        <div class="field"><input inputmode="numeric" data-f="neg" value="${fmt(s.neg)}" placeholder="${p.neg!=null?fmt(p.neg):"–"}"><small>neg</small></div>
        <button class="done ${s.done?"on":""}" data-act="done">✓</button></div>`;
    } else if (ex.bw){
      h += `<div class="setrow bw ${s.done?"isdone":""}" data-ex="${ex.id}" data-i="${i}">
        <div class="setno">${i+1}</div>
        <div class="field"><input inputmode="numeric" data-f="reps" value="${fmt(s.reps)}" placeholder="${p.reps!=null?fmt(p.reps):ex.top||"–"}"><small>Wdh</small></div>
        <button class="done ${s.done?"on":""}" data-act="done">✓</button></div>`;
    } else {
      h += `<div class="setrow ${s.done?"isdone":""}" data-ex="${ex.id}" data-i="${i}">
        <div class="setno">${i+1}</div>
        <div class="field"><input inputmode="decimal" data-f="kg" value="${fmt(s.kg)}" placeholder="${p.kg!=null?fmt(p.kg):"–"}"><small>kg</small></div>
        <div class="field"><input inputmode="numeric" data-f="reps" value="${fmt(s.reps)}" placeholder="${p.reps!=null?fmt(p.reps):ex.top||"–"}"><small>Wdh</small></div>
        <button class="done ${s.done?"on":""}" data-act="done">✓</button></div>`;
    }
  }
  return h;
}

const DEFAULT_GOAL = "Fett reduzieren und gleichzeitig etwas Muskeln am ganzen Körper aufbauen. Hauptsport ist Fahrradfahren: im Winter Kraft aufbauen, im Sommer leichter und fitter aufs Rad.";
function nprof(){ const d = S.docs.find(x=>x._id==="nutrition") || {}; return {goal:d.goal||DEFAULT_GOAL, likes:d.likes||"", avoid:d.avoid||"", effort:d.effort||"normal"}; }
function md(t){
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split("\n"); let out="", inUl=false;
  for (let l of lines){
    const li = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (li){ if(!inUl){out+="<ul>";inUl=true;} out+="<li>"+li[1]+"</li>"; continue; }
    if (inUl){ out+="</ul>"; inUl=false; }
    const hd = l.match(/^#{1,4}\s+(.*)/);
    if (hd) out+="<h4>"+hd[1]+"</h4>"; else if (l.trim()) out+="<p>"+l+"</p>";
  }
  return out + (inUl?"</ul>":"");
}

function coachContext(){
  const p = nprof(), ws = weights(), w = workouts(), rs = runs(), k = weekInfo();
  const now = Date.now(), d14 = now - 14*864e5, d28 = now - 28*864e5;
  const lastW = ws[ws.length-1], oldW = ws.filter(x=>new Date(x.day).getTime() <= d28).pop() || ws[0];
  const todayStr = today();
  const gymToday = w.filter(x => { const d=new Date(x.date); return d.toDateString()===new Date().toDateString(); });
  const runToday = rs.filter(x=>x.day===todayStr);

  const descW = x => (x.day?"Tag "+x.day+": ":"") + LIST.filter(e=>x.sets&&x.sets[e.id]).map(e=>e.name).join(", ");
  return [
    `Heute: ${new Date().toLocaleDateString("de-DE",{weekday:"long", day:"numeric", month:"long"})}, ${new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} Uhr.`,

const COACH_RULES = `Du bist der Ernährungs-Coach in einer persönlichen Fitness-App. Antworte auf Deutsch, freundlich und konkret, wie ein guter Trainer.
Feste Regeln:
- Orientiere dich an anerkannten Empfehlungen (z. B. DGE, Sporternährung). Eiweiß etwa 1,6–2,0 g pro kg Körpergewicht pro Tag, verteilt auf 3–5 Mahlzeiten.
- Für Fettabbau mit Muskelaufbau: höchstens moderates Defizit (ca. 300–500 kcal), an harten Trainingstagen eher ausgeglichen essen. Keine Crash-Diäten, kein Fasten-Druck, keine Verbote ganzer Lebensmittelgruppen.
- Nahrungsergänzung nie als Pflicht; höchstens Proteinpulver oder Kreatin als Option erwähnen.
- Unverträglichkeiten und Abneigungen IMMER strikt beachten.
- Mengen, Kalorien und Eiweiß sind Schätzungen: als ca.-Werte angeben.
- Bei Krankheiten, Medikamenten, Beschwerden oder Hinweisen auf sehr extremes Essverhalten: nicht mitgehen, freundlich an Ärztin/Arzt oder Ernährungsfachkraft verweisen.
- Format fürs Handy: höchstens ca. 180 Wörter, kurze Überschriften mit ###, Stichpunkte mit "- ", konkrete Gerichte mit ungefähren Mengen und Eiweiß. Keine Einleitung, keine Tabellen.`;
let coachCtl = null;
async function runCoach(kind, image){
  if (!S.sample || S.coachBusy) return;
  const q = (S.coachQ||"").trim();
  if (kind==="ask" && !q){ const el=$("#fq"); if(el) el.focus(); return; }
  const task = {
    today: "Aufgabe: Schlage einen Essensplan für den Rest von heute vor (je nach Uhrzeit nur die noch offenen Mahlzeiten), passend zum heutigen Training bzw. Ruhetag. Gib einen groben Eiweiß-Tagesrichtwert an.",
    post: "Aufgabe: Ich habe gerade trainiert. Was soll ich in den nächsten 1–2 Stunden essen? Gib 2–3 konkrete Optionen (schnell machbar) und einen kurzen Hinweis für den Rest des Tages.",
    ask: "Meine Frage: " + q,
    img: "Auf dem Foto ist mein Kühlschrank/Vorrat oder ein Teller Essen. Kühlschrank/Vorrat: schlage 2–3 Gerichte daraus vor, die zu meinem Ziel passen. Teller: schätze grob Kalorien und Eiweiß und sag, wie es zu meinem Ziel passt und was ich ergänzen könnte." + (q ? " Zusatz: " + q : ""),
  }[kind];
  S.coachBusy = true; S.coachText = ""; S.coachErr = ""; S.tab = "food"; render(); window.scrollTo(0,0);
  coachCtl = new AbortController();
  const prompt = COACH_RULES + "\n\nDaten aus der App:\n" + coachContext() + "\n\n" + task;
  try{
    const opts = { signal: coachCtl.signal, cache:false, onText: ({text}) => { S.coachText = text; const el = $("#ans"); if (el) el.innerHTML = md(text); } };
    if (image) opts.images = [image];
    const { text } = await S.sample(prompt, opts);
    S.coachText = text;
    if (col) queueWrite(()=>col.doc("lasttip").set({type:"tip", text, ts:Date.now()}));
    S.docs = S.docs.filter(d=>d._id!=="lasttip").concat({_id:"lasttip", type:"tip", text, ts:Date.now()});
    if (kind==="post") S.justFinished = false;
  } catch(e){
    const c = e && e.code;
    S.coachText = e && e.text || "";
    S.coachErr = c==="cancelled" ? "" : c==="not_granted"||c==="sampling_disabled" ? "Zugriff auf Claude nicht erlaubt." : c==="rate_limited" ? "Gerade zu viele Anfragen – bitte später nochmal." : c==="refused" ? "Darauf kann der Coach nicht antworten. Formuliere die Frage anders." : c==="image_rejected" ? "Das Bild geht nicht – bitte ein anderes wählen." : "Hat nicht geklappt. Bitte nochmal versuchen.";
    if (c==="refused") S.coachText = "";
    if (c==="not_granted"||c==="sampling_disabled") S.sample = null;
  }
  S.coachBusy = false; coachCtl = null; render();
}
function weightTrend(ws){
  const raw = ws.map(w=>({x:new Date(w.day+"T12:00").getTime(), y:w.kg}));
  const pts = raw.map(p => { const win = raw.filter(q => q.x<=p.x && q.x > p.x - 7*864e5); return {x:p.x, y: win.reduce((a,q)=>a+q.y,0)/win.length}; });
  const lastP = pts[pts.length-1] || {y:0, x:0};
  let rate = null;
  const ref = pts.filter(p => p.x <= lastP.x - 14*864e5).pop();
  if (ref){ rate = (lastP.y - ref.y) / ((lastP.x - ref.x) / (7*864e5)); }
  return {raw, pts, last:lastP.y, rate};
}
function viewWeight(){
  const ws = weights(); const last = ws[ws.length-1]; const first = ws[0];
  const diff = last && first && ws.length>1 ? last.kg - first.kg : null;
  const tr = weightTrend(ws), rate = tr.rate;
  return `
  <div class="card">
    <h2>Gewicht eintragen</h2>
    <div class="wbox" style="margin-top:10px">
      <input id="wkg" inputmode="decimal" placeholder="kg, z. B. 78,4" value="">
      <input id="wday" type="date" value="${today()}">
    </div>
    <button class="btn primary" data-act="wsave">Speichern</button>
  </div>
  ${ws.length ? `
  <div class="stat">
    <div><b>${fmt(last.kg)}</b><span>aktuell (kg)</span></div>
    <div><b>${fmt(Math.round(tr.last*10)/10)}</b><span>Trend Ø 7 Tage</span></div>
    <div><b style="color:${rate==null?"var(--text)":rate<=0?"var(--good)":"var(--warn)"}">${rate==null?"–":(rate>0?"+":"")+fmt(Math.round(rate*10)/10)}</b><span>kg pro Woche</span></div>
  </div>
  ${ws.length>1 ? `<div class="card">
    <div class="hint" style="display:flex;gap:14px;margin-bottom:6px"><span><span style="color:var(--accent)">━</span> Trend (Ø 7 Tage)</span><span><span style="color:var(--muted)">●</span> Messwerte</span></div>
    ${lineChart(tr.raw.slice(-60), {trend: tr.pts.slice(-60)})}
    <p class="hint" style="margin:8px 0 0">Seit Start: <b style="color:${diff<=0?"var(--good)":"var(--warn)"}">${diff>0?"+":""}${fmt(Math.round(diff*10)/10)} kg</b>${rate==null?" · Tempo pro Woche ab 2 Wochen Daten":""}</p>
  </div>` : ""}
  <div class="card list">${ws.slice().reverse().map(w=>`<div class="item"><span>${dDE(w.day+"T12:00")}</span><span><b>${fmt(w.kg)} kg</b><button class="x" data-act="wdel" data-id="${esc(w._id)}">✕</button></span></div>`).join("")}</div>`
  : `<div class="empty">Noch keine Einträge.</div>`}`;
}
function chart(ws){
  const pts = ws.slice(-30); const W=320,H=150,P=26;
  const ys = pts.map(p=>p.kg); let mn=Math.min(...ys), mx=Math.max(...ys); if (mx-mn<1){ mn-=.5; mx+=.5; }
  const t0 = new Date(pts[0].day).getTime(), t1 = new Date(pts[pts.length-1].day).getTime() || t0+1;
  const X = d => P + (t1===t0?0.5:(new Date(d).getTime()-t0)/(t1-t0))*(W-P-8);
  const Y = v => 10 + (1-(v-mn)/(mx-mn))*(H-P-10);
  const line = pts.map(p=>`${X(p.day).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    <line x1="${P}" x2="${W-8}" y1="${Y(mx)}" y2="${Y(mx)}" stroke="#2a2f3a"/><line x1="${P}" x2="${W-8}" y1="${Y(mn)}" y2="${Y(mn)}" stroke="#2a2f3a"/>
    <text x="0" y="${Y(mx)+3}">${fmt(Math.round(mx*10)/10)}</text><text x="0" y="${Y(mn)+3}">${fmt(Math.round(mn*10)/10)}</text>
    <polyline points="${line}" fill="none" stroke="#c6f432" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${X(p.day).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="3" fill="#c6f432"/>`).join("")}
    <text x="${P}" y="${H-4}">${new Date(pts[0].day).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}</text>
    <text x="${W-8}" y="${H-4}" text-anchor="end">${new Date(pts[pts.length-1].day).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}</text>
  </svg>`;
}

function viewHistory(){
  const w = workouts();
  if (!w.length) return `<div class="empty">Noch keine Trainings gespeichert.</div>`;
  const best = {};
  for (const x of w) for (const id in (x.sets||{})) for (const s of x.sets[id]){
    const ex = EX[id]; if (!ex) continue;
    const score = ex.pull||ex.bw ? (s.reps||0) : (s.kg||0);
    if (!best[id] || score > best[id].score || (score===best[id].score && (s.reps||0)>(best[id].reps||0))) best[id] = {score, ...s};
  }
  const vol = x => Object.values(x.sets||{}).flat().reduce((a,s)=>a+(s.kg||0)*(s.reps||0),0);
  return `
  <div class="stat"><div><b>${w.length}</b><span>Trainings</span></div><div><b>${w.filter(x=>Date.now()-x.date<7*864e5).length}</b><span>letzte 7 Tage</span></div></div>
  ${pullCard(w)}
  ${strengthCard(w)}
  <div class="card"><h2 style="margin-bottom:10px">Bestwerte</h2><div class="best">
    ${LIST.filter(e=>best[e.id]).map(e=>{const b=best[e.id];return `<span>${esc(e.name)}</span><span>${e.pull||e.bw?fmt(b.reps)+" Wdh":fmt(b.kg)+" kg × "+fmt(b.reps)}</span>`}).join("")}
  </div></div>
  <div class="card">${w.map(x=>`
    <details><summary><span><b>${dDE(x.date)}</b>${x.day?` <span class="badge">Tag ${x.day}</span>`:""}<br><span class="hint">${x.duration?x.duration+" min · ":""}${Math.round(vol(x)).toLocaleString("de-DE")} kg Volumen</span></span><span class="hint">▾</span></summary>
      <div class="dl">${LIST.filter(e=>x.sets&&x.sets[e.id]&&x.sets[e.id].length).map(e=>`<b>${esc(e.name)}:</b> ${x.sets[e.id].map(s=>e.bw?fmt(s.reps):e.pull?fmt(s.reps)+(s.neg?"+"+fmt(s.neg)+"n":""):fmt(s.kg)+"×"+fmt(s.reps)).join(", ")}`).join("<br>")}
      <br><button class="x" style="padding-left:0;color:var(--warn);font-size:13px" data-act="hdel" data-id="${esc(x._id)}">Training löschen</button></div>
    </details>`).join("")}</div>`;
}

function pullCard(w){
  const goal = settings().pullGoal;
  const pts = w.filter(x=>x.sets&&x.sets.pu&&x.sets.pu.length).map(x=>({x:x.date, y:Math.max(...x.sets.pu.map(s=>s.reps||0))})).reverse();
  const best = pts.length ? Math.max(...pts.map(p=>p.y)) : 0;
  return `<div class="card">
    <h2>Klimmzüge</h2>
    <div class="big"><b>${best}</b><span class="hint">${best>=goal?"🎉 Ziel erreicht!":"saubere Wdh am Stück · noch "+(goal-best)+" bis zum Ziel"}</span></div>
    ${lineChart(pts.slice(-30), {goal, zero:true})}
    <div class="goal" style="margin-top:6px">Ziel <button data-act="pg" data-d="-1">−</button><b>${goal}</b><button data-act="pg" data-d="1">+</button> Wdh am Stück</div>
  </div>`;
}
function strengthCard(w){
  const opts = LIST.filter(e=>!e.pull&&!e.bw);
  if (!opts.find(e=>e.id===S.sel)) S.sel = opts[0].id;
  const pts = w.filter(x=>x.sets&&x.sets[S.sel]&&x.sets[S.sel].length).map(x=>({x:x.date, y:Math.max(...x.sets[S.sel].map(s=>e1rm(s.kg,s.reps)))})).filter(p=>p.y>0).reverse();
  const cur = pts.length ? pts[pts.length-1].y : 0, first = pts.length ? pts[0].y : 0;
  const pct = first ? Math.round((cur/first-1)*100) : 0;
  return `<div class="card">
    <h2>Kraftkurve</h2>
    <select id="exsel">${opts.map(e=>`<option value="${e.id}" ${e.id===S.sel?"selected":""}>${esc(e.name)}</option>`).join("")}</select>
    ${pts.length ? `<div class="big"><b>${fmt(Math.round(cur*2)/2)} kg</b><span class="hint">geschätztes Maximalgewicht (1RM)${pts.length>1?` · <span style="color:${pct>=0?"var(--good)":"var(--warn)"}">${pct>=0?"+":""}${pct} %</span> seit Start`:""}</span></div>` : ""}
    ${pts.length ? lineChart(pts.slice(-30)) : `<div class="empty" style="padding:10px 0">Noch keine Daten für diese Übung.</div>`}
  </div>`;
}

/* ---------- timer ---------- */
function startTimer(sec, label){ S.timer = {end: Date.now()+sec*1000, label}; tick(); }
function tick(){
  const el = $("#timer");
  if (!S.timer){ el.classList.remove("show"); return; }
  const left = Math.round((S.timer.end-Date.now())/1000);
  const a = Math.abs(left);
  $("#tval").textContent = (left<0?"+":"") + Math.floor(a/60) + ":" + String(a%60).padStart(2,"0");
  $("#tlbl").textContent = left<0 ? "Pause vorbei – weiter!" : S.timer.label;
  el.classList.add("show"); el.classList.toggle("over", left<0);
  if (left===0){ try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} }
}
setInterval(()=>{ if (S.timer) tick(); }, 500);

function nextLabel(ex){
  if (!ex.group || !isSuper(ex.group)) return "Pause · nächster Satz " + ex.name;
  const mates = curPlan().filter(e=>e.group===ex.group); const i = mates.indexOf(ex);
  return "Pause · dann " + mates[(i+1)%mates.length].name;
}

/* ---------- confirm ---------- */
function ask(text, fn){ S.confirm = fn; $("#mtext").textContent = text; $("#modal").classList.add("show"); }

/* ---------- events ---------- */
document.addEventListener("input", e => {
  const inp = e.target;
  const rmap = {rday:"day", rtime:"time", rkm:"km", rpace:"pace", rhr:"hr", rkcal:"kcal", relev:"elev"};
  if (inp.id==="fq"){ S.coachQ = inp.value; return; }
  if (rmap[inp.id]){
    S.rf = S.rf || {}; S.rf[rmap[inp.id]] = inp.value;
    if (inp.id==="rpace") S.paceManual = inp.value.trim()!=="";
    if ((inp.id==="rtime"||inp.id==="rkm") && !S.paceManual){
      const km = num($("#rkm").value), sec = parseTime($("#rtime").value);
      const v = km>0 && sec>0 ? mmss(sec/km) : ""; $("#rpace").value = v; S.rf.pace = v;
    }
    return;
  } const row = inp.closest(".setrow"); if (!row || !S.draft) return;
  const id = row.dataset.ex, i = +row.dataset.i;
  const arr = S.draft.sets[id] = S.draft.sets[id] || [];
  while (arr.length <= i) arr.push({});
  arr[i][inp.dataset.f] = num(inp.value);
  saveDraftSoon();
});
document.addEventListener("focusout", () => setTimeout(()=>{ const ae=document.activeElement; if (S.pendingRender && !(ae && (ae.tagName==="INPUT"||ae.tagName==="SELECT"||ae.tagName==="TEXTAREA"))){ S.pendingRender=false; if (!(S.tab==="training" && S.draft)) render(); } },0));

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-act]"); if (!t) return;
  if (t.dataset.tab){ S.tab = t.dataset.tab; render(); window.scrollTo(0,0); return; }
  const a = t.dataset.act;
  if (a==="start"){ const sup = t.dataset.mode==="super"; S.draft = {started: Date.now(), day: S.day || nextDay(), sets:{}, mode:{A:sup,B:sup,C:sup}}; saveDraftSoon(); render(); window.scrollTo(0,0); }
  if (a==="done"){
    const row = t.closest(".setrow"); const id=row.dataset.ex, i=+row.dataset.i; const ex = EX[id];
    const arr = S.draft.sets[id] = S.draft.sets[id] || []; while (arr.length<=i) arr.push({});
    const s = arr[i];
    // fill from placeholders if empty
    row.querySelectorAll("input").forEach(inp => { if (inp.value==="" && inp.placeholder && inp.placeholder!=="–"){ inp.value = inp.placeholder; s[inp.dataset.f] = num(inp.placeholder); } });
    s.done = !s.done;
    t.classList.toggle("on", s.done); row.classList.toggle("isdone", s.done);
    if (s.done) startTimer(restOf(ex), nextLabel(ex));
    saveDraftSoon();
  }
  if (a==="finish"){
    const sets = {};
    for (const id in S.draft.sets){ const v = S.draft.sets[id].filter(s => s && (s.done || s.reps!=null)).map(s => { const o={reps:s.reps??0}; if (EX[id]&&EX[id].pull){ if(s.neg!=null) o.neg=s.neg; } else if (!(EX[id]&&EX[id].bw)) o.kg = s.kg??0; return o; }); if (v.length) sets[id]=v; }
    if (!Object.keys(sets).length){ ask("Noch keine Sätze eingetragen. Trotzdem beenden?", ()=>{ discard(); }); return; }
    const doc = {type:"workout", date: Date.now(), duration: Math.round((Date.now()-S.draft.started)/60000), day:S.draft.day||"A", mode:S.draft.mode||{}, sets};
    if (col){ const ref = col.doc("w-" + doc.date); queueWrite(()=>ref.set(doc)); queueWrite(()=>col.doc("draft").delete()); }
    S.docs.push({_id:"w-"+doc.date, ...doc});
    S.draft = null; S.timer = null; tick(); clearTimeout(draftTimer); S.justFinished = true; S.day = null; S.tab="training"; render(); window.scrollTo(0,0);
  }
  if (a==="day"){ S.day = t.dataset.v; render(); }
  if (a==="mode" && S.draft){ S.draft.mode = S.draft.mode||{}; S.draft.mode[t.dataset.g] = t.dataset.v==="1"; saveDraftSoon(); render(); }
  if (a==="cancel") ask("Training verwerfen? Eingetragene Sätze gehen verloren.", discard);
  if (a==="tminus" && S.timer){ S.timer.end -= 15000; tick(); }
  if (a==="tplus" && S.timer){ S.timer.end += 15000; tick(); }
  if (a==="tskip"){ S.timer = null; tick(); }
  if (a==="wsave"){
    const kg = num($("#wkg").value), day = $("#wday").value || today();
    if (kg==null || kg<20 || kg>400){ $("#wkg").focus(); return; }
    const doc = {type:"weight", day, kg};
    if (col) queueWrite(()=>col.doc("bw-"+day).set(doc));
    S.docs = S.docs.filter(d=>d._id!=="bw-"+day).concat({_id:"bw-"+day, ...doc}); render();
  }
  if (a==="rsave"){
    const km = num($("#rkm").value), sec = parseTime($("#rtime").value), day = $("#rday").value || today();
    if (km==null || km<=0 || km>200){ $("#rkm").focus(); return; }
    if (sec==null || sec<=0){ $("#rtime").focus(); return; }
    const ts = Date.now(), doc = {type:"run", day, km, sec, ts};
    const pace = parseTime($("#rpace").value); doc.pace = pace && pace>60 && pace<1800 ? pace : Math.round(sec/km);
    const hr = num($("#rhr").value), kcal = num($("#rkcal").value), elev = num($("#relev").value);
    if (hr && hr>40 && hr<230) doc.hr = Math.round(hr);
    if (kcal && kcal>0) doc.kcal = Math.round(kcal);
    if (elev!=null && elev>=0) doc.elev = Math.round(elev);
    if (S.runExtra && typeof S.runExtra.cad==="number") doc.cad = Math.round(S.runExtra.cad);
    S.runExtra = null; S.rf = null; S.importMsg = ""; S.paceManual = false;
    if (col) queueWrite(()=>col.doc("run-"+ts).set(doc));
    S.docs.push({_id:"run-"+ts, ...doc}); render();
  }
  if (a==="coach") runCoach(t.dataset.k);
  if (a==="cstop" && coachCtl) coachCtl.abort();
  if (a==="fimg"){ const f = $("#ffile"); if (f) f.click(); }
  if (a==="prof"){ S.profOpen = !S.profOpen; render(); }
  if (a==="psave"){
    const d = {type:"nutrition", goal: $("#pgoal").value.trim()||DEFAULT_GOAL, likes: $("#plikes").value.trim(), avoid: $("#pavoid").value.trim(), effort: $("#peffort").value};
    if (col) queueWrite(()=>col.doc("nutrition").set(d));
    S.docs = S.docs.filter(x=>x._id!=="nutrition").concat({_id:"nutrition", ...d}); S.profOpen = false; render();
  }
  if (a==="rimg"){ const f = $("#rfile"); if (f) f.click(); }
  if (a==="rdel"){ const id=t.dataset.id; ask("Lauf löschen?", ()=>{ if(col) queueWrite(()=>col.doc(id).delete()); S.docs=S.docs.filter(d=>d._id!==id); render(); }); }
  if (a==="wdel"){ const id=t.dataset.id; ask("Eintrag löschen?", ()=>{ if(col) queueWrite(()=>col.doc(id).delete()); S.docs=S.docs.filter(d=>d._id!==id); render(); }); }
  if (a==="hdel"){ const id=t.dataset.id; ask("Dieses Training löschen?", ()=>{ if(col) queueWrite(()=>col.doc(id).delete()); S.docs=S.docs.filter(d=>d._id!==id); render(); }); }
  if (a==="wg") setSetting("weekGoal", Math.min(7, Math.max(1, settings().weekGoal + +t.dataset.d)));
  if (a==="pg") setSetting("pullGoal", Math.min(50, Math.max(1, settings().pullGoal + +t.dataset.d)));
  if (a==="mno"){ $("#modal").classList.remove("show"); S.confirm=null; }
  if (a==="myes"){ $("#modal").classList.remove("show"); const f=S.confirm; S.confirm=null; f && f(); }
});
async function importShot(file){
  if (!S.sample || !file) return;
  S.importing = true; S.importMsg = ""; render();
  const prompt = `Heute ist ${today()}. Das Bild ist ein Screenshot eines Trainings aus der Apple-Fitness-App (deutsche Oberfläche).
Lies die Werte ab. Das Datum steht oben ohne Jahr (z. B. "Fr. 13. Nov.") – nimm das jüngste passende Datum, das nicht nach heute liegt. Steht dort "Heute" oder "Gestern", rechne relativ zu heute.
Antworte NUR mit JSON in genau dieser Form:
{"is_run": true, "date": "YYYY-MM-DD", "distance_km": 4.76, "duration": "0:28:19", "avg_pace": "5:56", "avg_hr": 171, "active_kcal": 477, "elevation_m": 64, "cadence_spm": 147}
- duration = "Trainingszeit" als h:mm:ss
- avg_pace = "Ø-Pace" als m:ss (5'56" wird zu "5:56")
- active_kcal = Aktivitätskilokalorien
- Felder, die nicht sichtbar sind, auf null setzen
- is_run = false, wenn es kein Lauf (Laufen/Joggen) ist`;
  try{
    const d = await S.sample.json(prompt, {images:[file], modelTier:"quick"});
    const km = Number(d && d.distance_km), sec = parseTime(d && d.duration);
    if (!d || !(km>0) || !sec){ S.importMsg = "Konnte keine Laufdaten erkennen. Bitte Werte von Hand eintragen."; }
    else {
      const pc = parseTime(String(d.avg_pace||"").replace(/['’′]/g,":").replace(/["”″]/g,"")) || Math.round(sec/km);
      S.rf = { day: /^\d{4}-\d{2}-\d{2}$/.test(d.date||"") ? d.date : today(), km: fmt(km), time: mmss(sec), pace: mmss(pc),
        hr: d.avg_hr ? String(Math.round(d.avg_hr)) : "", kcal: d.active_kcal ? String(Math.round(d.active_kcal)) : "", elev: d.elevation_m!=null ? String(Math.round(d.elevation_m)) : "" };
      S.paceManual = true;
      S.runExtra = { kcal: d.active_kcal==null?null:Number(d.active_kcal), elev: d.elevation_m==null?null:Number(d.elevation_m), cad: d.cadence_spm==null?null:Number(d.cadence_spm) };
      S.importMsg = d.is_run===false ? "Achtung: Das sieht nicht nach einem Lauf aus. Bitte prüfen." : "✓ Werte übernommen – kurz prüfen und speichern.";
    }
  } catch(e){
    const c = e && e.code;
    S.importMsg = c==="not_granted"||c==="sampling_disabled" ? "Import nicht erlaubt – Werte bitte von Hand eintragen."
      : c==="rate_limited" ? "Gerade zu viele Anfragen. Bitte gleich nochmal versuchen."
      : c==="image_rejected" ? "Dieses Bild geht nicht. Bitte einen PNG- oder JPG-Screenshot wählen."
      : "Import hat nicht geklappt. Bitte nochmal versuchen.";
    if (c==="not_granted"||c==="sampling_disabled"||c==="images_unavailable") S.canImg = false;
  }
  S.importing = false; render();
}
document.addEventListener("change", e => {
  if (e.target.id==="ffile"){ const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) runCoach("img", f); return; }
  if (e.target.id==="rmsel"){ S.rm = e.target.value; render(); return; }
  if (e.target.id==="rfile"){ const f = e.target.files && e.target.files[0]; e.target.value = ""; importShot(f); return; } if (e.target.id==="exsel"){ S.sel = e.target.value; render(); } });
function discard(){ clearTimeout(draftTimer); S.draft=null; S.timer=null; tick(); if (col) queueWrite(()=>col.doc("draft").delete()); render(); }

init();
</script>
